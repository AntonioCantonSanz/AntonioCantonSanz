name: Actualizar panel

on:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes a las 6:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "panel/generar_panel.py"

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar panel.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python panel/generar_panel.py panel/panel.svg
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/panel.svg
          git diff --cached --quiet || git commit -m "Actualizar panel"
          git push
